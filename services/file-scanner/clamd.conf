Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
OfficialDatabaseOnly yes
LocalSocket /run/clamav/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
SelfCheck 60
ConcurrentDatabaseReload no
StreamMaxLength 20M
MaxFileSize 20M
MaxScanSize 100M
MaxRecursion 16
MaxFiles 1000
MaxThreads 2
MaxQueue 4
MaxConnectionQueueLength 4
ReadTimeout 10
CommandReadTimeout 3
SendBufTimeout 500
MaxScanTime 8000
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
DisableCache yes
TemporaryDirectory /tmp/clamav
LogFile /dev/null
LogFileUnlock yes
LogClean no
LogVerbose no
LogSyslog no
ExtendedDetectionInfo no
